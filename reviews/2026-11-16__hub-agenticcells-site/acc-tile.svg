<!-- Option 3, "ACC tile": the letters on an accent square, for the favicon and app icons (16 to 64px). The square is not a circle on purpose: two Cs in a circle is the Creative Commons symbol.
     Colours are the D1 accent and on-accent tokens, light and dark. Proposal by specialist.design@AgentiCCells.dinis, 2026-11-16. CC BY 4.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ACC">
  <style>
    .tile { fill: #0a5c6b; } .ink { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) { .tile { fill: #6ec6d6; } .ink { stroke: #111518; } }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <g class="ink" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 22 L8 10 L12 22 M5.5 17.5 H10.5"/>
    <path d="M21 11.67 A5 5 0 1 0 21 20.33"/>
    <path d="M27.5 11.67 A5 5 0 1 0 27.5 20.33"/>
  </g>
</svg>
