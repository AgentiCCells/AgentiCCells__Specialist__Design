<link rel="stylesheet" href="../pack/tokens.css">
<style>
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: var(--bg); color: var(--fg); font-family: var(--font); display: grid; grid-template-rows: 1fr auto; }
.main { padding: 96px 80px 0; }
.mark { color: var(--accent); }
.kicker { font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: .02em; margin: 0 0 14px; }
h1 { font-size: 88px; line-height: 1.02; margin: 0 0 24px; letter-spacing: -.02em; }
p { font-size: 34px; line-height: 1.3; margin: 0; color: var(--muted); max-width: 980px; }
.foot { display: flex; justify-content: space-between; align-items: center; padding: 26px 80px; border-top: 2px solid var(--line); font-size: 26px; color: var(--muted); }
.sw { display: flex; gap: 10px; }
.sw span { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); }
.a { background: var(--accent); } .f { background: var(--fg); } .m { background: var(--muted); } .s { background: var(--surface); } .o { background: var(--ok); } .w { background: var(--warn); } .b { background: var(--bad); }
</style>
</head>
